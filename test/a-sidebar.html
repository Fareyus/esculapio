<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="icon" href="../favicon.png"><link rel="stylesheet" href="shared.css"><title>EsculapioNET · Test A</title>
<style>
.app{display:flex;height:100vh}
aside{width:224px;flex:none;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column}
.brand{height:60px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--border);font-weight:600;line-height:1.1}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--muted-fg)}
nav{padding:10px;display:flex;flex-direction:column;gap:2px}
nav button{display:flex;justify-content:space-between;align-items:center;border:0;background:none;color:var(--muted-fg);font:inherit;font-weight:500;padding:8px 10px;border-radius:6px;cursor:pointer;text-align:left}
nav button:hover{background:var(--accent);color:var(--foreground)}
nav button.on{background:color-mix(in srgb,var(--primary) 10%,transparent);color:var(--primary)}
nav .c{font-size:11px;font-family:var(--mono)}
.side-foot{margin-top:auto;padding:14px 16px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
main{flex:1;min-width:0;display:flex;flex-direction:column;padding:16px 20px;gap:14px;overflow:auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-size:19px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;align-items:start}
.sec{padding:6px}
.sec h2{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted-fg);padding:8px 10px 6px;display:flex;justify-content:space-between}
.hide{display:none!important}
@media(max-width:760px){aside{display:none}.stats{grid-template-columns:1fr}}
</style></head><body><div class="app">
<aside><div class="brand"><img class="logo" src="../logo.png" alt=""><span>EsculapioNET<small>Centrale 118</small></span></div>
<nav id="nav"><button class="on" data-f="all">Tutto</button>
<button data-f="comune">Comune <span class="c" data-count="comune"></span></button>
<button data-f="urgenti">Trasporti Urgenti <span class="c" data-count="urgenti"></span></button>
<button data-f="emergenza">Emergenza Sanitaria <span class="c" data-count="emergenza"></span></button>
<button data-f="archivio">Archivio <span class="c" data-count="archivio"></span></button></nav>
<div class="side-foot"><div><div class="mono" style="font-weight:700;font-size:16px" data-clock></div><div class="muted" style="font-size:11px;text-transform:capitalize" data-date></div></div><button class="btn" data-theme-btn title="Tema">◐</button></div></aside>
<main><div class="top"><div><h1>Centrale 118 · Firenze–Prato</h1><div class="muted">Accesso rapido ai sistemi operativi</div></div>
<div style="width:min(320px,100%)"><input class="search" data-search placeholder="Cerca un link…  (premi \)"></div></div>
<div class="stats"><div class="card shift" style="padding:12px 14px"><div class="lbl">Ordinari · <span data-win="urg"></span></div><div class="val mono" data-cd="urg">--:--:--</div><div class="bar"><i data-bar="urg"></i></div></div>
<div class="card shift" style="padding:12px 14px"><div class="lbl">Emergenza · <span data-win="eme"></span></div><div class="val mono" data-cd="eme">--:--:--</div><div class="bar"><i data-bar="eme"></i></div></div>
<div class="card" style="padding:12px 14px"><div class="tag" style="text-transform:uppercase;letter-spacing:.4px">Età paziente</div><div class="age" data-age style="margin-top:6px"><input inputmode="numeric" placeholder="Anno" aria-label="Anno di nascita"><button class="btn">Calcola</button></div><div class="res mono muted" style="font-size:12px;margin-top:5px;min-height:15px"></div></div></div>
<div class="grid">
<section class="card sec" data-section="comune"><h2>Comune</h2><div data-links="comune"></div></section>
<section class="card sec" data-section="urgenti"><h2>Trasporti Urgenti</h2><div data-links="urgenti"></div></section>
<section class="card sec" data-section="emergenza"><h2>Emergenza Sanitaria</h2><div data-links="emergenza"></div></section>
<section class="card sec" data-section="archivio"><h2>Archivio</h2><div data-links="archivio"></div></section>
</div></main></div>
<script src="data.js"></script><script src="shared.js"></script>
<script>$$("#nav button").forEach(b=>b.onclick=()=>{$$("#nav button").forEach(x=>x.classList.toggle("on",x===b));
$$("[data-section]").forEach(s=>s.classList.toggle("hide",b.dataset.f!=="all"&&s.dataset.section!==b.dataset.f))})</script>
</body></html>
