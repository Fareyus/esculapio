<head>
<meta charset="utf-8">

<style>
/* ============ TOKENS ============ */
:root{
  --bg:#080b1e; --frame:#28325f; --frame-hi:#3d4d8a;
  --text:#d8e0f6; --dim:#7d89ba; --faint:#4b567f;
  --sel:#141d44; --cyan:#39d6cf; --amber:#f2b64a; --ok:#3ad98c; --brand:#8ea2ff;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
[data-theme="light"]{
  --bg:#eceff6; --frame:#c7cee2; --frame-hi:#9aa6cf;
  --text:#0d1430; --dim:#5a6488; --faint:#aab2cf;
  --sel:#dde3f2; --cyan:#0a8f9c; --amber:#8a5e05; --ok:#1a9d5a; --brand:#14208c;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(120% 90% at 50% 0%, color-mix(in srgb,var(--brand) 8%,var(--bg)) 0%, var(--bg) 60%),
    var(--bg);
  color:var(--text);font-family:var(--mono);
  font-size:14px;line-height:1.5;
  padding:clamp(10px,2.4vw,26px);-webkit-font-smoothing:antialiased;
}

/* ============ FRAME ============ */
.term{
  max-width:1080px;margin:0 auto;background:color-mix(in srgb,var(--bg) 86%,#000);
  border:1px solid var(--frame);border-radius:6px;overflow:hidden;
  box-shadow:0 24px 70px rgba(0,0,0,.5),0 0 0 1px color-mix(in srgb,var(--cyan) 8%,transparent) inset;
}
[data-theme="light"] .term{background:#fff;box-shadow:0 18px 50px rgba(16,24,48,.14)}

/* ---- top bar ---- */
.bar{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:10px 15px;border-bottom:1px solid var(--frame);
  background:color-mix(in srgb,var(--frame) 22%,transparent);
}
.title{font-weight:700;letter-spacing:.5px;font-size:15px}
.title .s{color:var(--cyan)}
.bar .sub{color:var(--dim);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.bar .right{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:13px}
.stat{display:inline-flex;align-items:center;gap:7px;color:var(--dim);letter-spacing:.14em}
.stat .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:blink 1.6s steps(1) infinite}
.clk{color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:1px}
.tbtn{font-family:var(--mono);font-size:13px;color:var(--dim);background:none;border:1px solid var(--frame);border-radius:4px;padding:3px 8px;cursor:pointer;transition:color .12s,border-color .12s}
.tbtn:hover{color:var(--cyan);border-color:var(--frame-hi)}
.tbtn:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

/* ---- status line (turni + news) ---- */
.status{
  display:flex;align-items:stretch;border-bottom:1px solid var(--frame);
  font-size:12.5px;color:var(--dim);
}
.turni{padding:7px 15px;white-space:nowrap;border-right:1px solid var(--frame);display:flex;gap:14px;align-items:center}
.turni b{color:var(--dim);font-weight:400}
.turni .v{color:var(--text);font-variant-numeric:tabular-nums}
.turni .k{color:var(--cyan)}
.turni .ke{color:var(--amber)}
.news{overflow:hidden;flex:1;display:flex;align-items:center;padding:0 4px}
.news .tag{color:var(--cyan);padding:0 12px;flex:none;letter-spacing:.1em}
.news-vp{overflow:hidden;flex:1}
.news-in{display:inline-block;white-space:nowrap;animation:scroll var(--dur,60s) linear infinite}
.status:hover .news-in{animation-play-state:paused}
.news-in a{color:var(--text);text-decoration:none}
.news-in a:hover{color:var(--cyan)}
.news-in .sep{color:var(--faint);padding:0 22px}

/* ---- prompt ---- */
.prompt{display:flex;align-items:center;gap:9px;padding:12px 15px;border-bottom:1px solid var(--frame)}
.ps1{color:var(--dim);white-space:nowrap;font-size:13.5px}
.ps1 .u{color:var(--brand)}
.ps1 .t{color:var(--cyan)}
#cmd{
  flex:1;background:none;border:none;outline:none;color:var(--text);
  font-family:var(--mono);font-size:15px;caret-color:var(--cyan);padding:0;
}
#cmd::placeholder{color:var(--faint)}
.curs{width:9px;height:18px;background:var(--cyan);flex:none;animation:blink 1.1s steps(1) infinite;opacity:.9}

/* ---- result line (eta / errori) ---- */
.res{padding:9px 15px;border-bottom:1px solid var(--frame);font-size:13.5px;color:var(--cyan)}
.res.err{color:var(--amber)}
.res .p{color:var(--dim)}

/* ---- listing ---- */
.listing{padding:8px 0 6px;max-height:min(64vh,640px);overflow:auto}
.listing::-webkit-scrollbar{width:10px}
.listing::-webkit-scrollbar-thumb{background:var(--frame);border-radius:0}
.sec{margin:6px 0 10px}
.sec-h{display:flex;align-items:center;gap:10px;padding:4px 15px;color:var(--dim);font-size:12px;letter-spacing:.13em}
.sec-h .lbl{color:var(--cyan)}
.sec-h .lbl b{color:var(--dim);font-weight:400}
.sec-h .lead{flex:1;border-top:1px solid var(--frame)}
.sec-h .n{color:var(--dim);font-variant-numeric:tabular-nums}
.row{
  display:flex;align-items:center;gap:10px;padding:3px 15px;
  text-decoration:none;color:var(--text);cursor:pointer;position:relative;
}
.row .mk{width:12px;flex:none;color:var(--cyan);visibility:hidden}
.row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.row .fl{margin-left:auto;color:var(--amber);font-size:11.5px;letter-spacing:.06em;flex:none}
.row .go{color:var(--cyan);flex:none;visibility:hidden;font-size:13px}
.row.sel{background:var(--sel)}
.row.sel .mk{visibility:visible}
.row.sel .nm{color:#fff}
[data-theme="light"] .row.sel .nm{color:var(--brand)}
.row.sel .go{visibility:visible}
.row:focus-visible{outline:2px solid var(--cyan);outline-offset:-2px}

/* ---- footer hints ---- */
.foot{
  display:flex;gap:18px;flex-wrap:wrap;align-items:center;
  padding:8px 15px;border-top:1px solid var(--frame);color:var(--dim);font-size:12px;
  background:color-mix(in srgb,var(--frame) 16%,transparent);
}
.foot .key{color:var(--text);background:color-mix(in srgb,var(--frame) 50%,transparent);border:1px solid var(--frame);border-radius:3px;padding:0 5px}
.foot .r{margin-left:auto;color:var(--faint)}
.foot .amber{color:var(--amber)}

@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){
  .curs,.stat .dot{animation:none}
  .news-in{animation:none}
}
@media(max-width:600px){
  body{font-size:13px}
  .turni{white-space:normal}
  .news{display:none}
}
</style>
</head>
<body>
<div class="term" role="application" aria-label="Terminale EsculapioNET">

  <div class="bar">
    <span class="title">esculapio<span class="s">//</span>net</span>
    <span class="sub">centrale 118 · fi-po</span>
    <span class="right">
      <span class="stat"><i class="dot"></i>oper</span>
      <span class="clk" id="clk">--:--:--</span>
      <button class="tbtn" id="theme" aria-label="Cambia tema" title="Tema chiaro/scuro">[◐]</button>
    </span>
  </div>

  <div class="status">
    <div class="turni" id="turni">
      <span id="t-ord"><b>turno</b> <span class="k">ord</span> <span class="v" id="cd-ord">--:--:--</span></span>
      <span id="t-eme"><b></b> <span class="ke">eme</span> <span class="v" id="cd-eme">--:--:--</span></span>
    </div>
    <div class="news" id="news">
      <span class="tag">news//fi·po</span>
      <div class="news-vp"><div class="news-in" id="news-in"><span>caricamento notizie…</span></div></div>
    </div>
  </div>

  <div class="prompt">
    <span class="ps1"><span class="u">operatore</span>@<span class="t">esculapio</span>:~$</span>
    <input id="cmd" type="text" autocomplete="off" spellcheck="false"
           placeholder="cerca un link, oppure  eta 1980  ·  premi \" aria-label="Comando o ricerca">
    <span class="curs" id="curs" aria-hidden="true"></span>
  </div>

  <div class="res hidden" id="res"></div>

  <div class="listing" id="listing"></div>

  <div class="foot">
    <span><span class="key">↑↓</span> naviga</span>
    <span><span class="key">↵</span> apri</span>
    <span><span class="key">\</span> cerca</span>
    <span><span class="key">esc</span> pulisci</span>
    <span><span class="amber">eta &lt;anno&gt;</span> calcola età</span>
    <span class="r">link <span class="amber">[lan]</span> = solo rete interna 118</span>
  </div>

</div>

<script>
/* =========================================================
   DATI — per aggiungere/modificare un link, cambia qui.
   intranet: true  → mostra il flag [lan]
========================================================= */
const SITE_DATA = {
  comune: [
    { label: "Mail USL Centro",             url: "https://webmail.sanita.toscana.it/" },
    { label: "Mail EsculapioNET",           url: "https://outlook.office.com/mail/" },

    { label: "Mail Associazioni",           url: "https://docs.google.com/spreadsheets/d/1vvzBGbQW4WD_JToWUck5UkftfQABUR4donJxbMMWwFg/edit" },
    { label: "Turnazione Centrale 2026",    url: "https://docs.google.com/spreadsheets/d/16Zr8K8RBmMwz36aadtCGwlgUs5nl3WJuriIuNXd1oGY/edit?gid=1201701440#gid=1201701440" },

    { label: "Mappa Sinottica EU FI-PO",    url: "https://www.google.com/maps/d/u/0/viewer?hl=it&ll=43.749161033153946%2C11.223471242045049&z=11&mid=1sL_UeJEQEL1CO2WbPerkVYeALvjpGHY" },
    { label: "POT",                         url: "http://auth.sin.asf.it/login.php" },

  ],
  urgenti: [

    { label: "Lista Trasporti Entro-RT",       url: "https://docs.google.com/spreadsheets/d/127_ym_5atztWavdqCmabw4qVHaYdo2mbbFNKNcvWoqI/edit" },
    { label: "Lista Trasporti EXTRA-RT",       url: "https://docs.google.com/spreadsheets/d/1JOjGTEOhtfBt7vlznT-giyOKSul2Fo2LSOVdDgfK4Sg/edit" },
    { label: "Rubrica Trasporti Salma",        url: "https://docs.google.com/spreadsheets/d/1mMYw8xa1EZ15YK4cwn6Gw5hADZJ26Xvg3KHUKHpMdyo/edit" },
    { label: "Programmazione 1° Servizio",     url: "https://drive.google.com/drive/u/0/folders/11RbVBLZv6SRwvim9nR2FJZ0ZLYdsBnJ6" },
    { label: "Turnazione PRATO",               url: "https://drive.google.com/file/d/12gCfvRuQjvZ8JhAe3iktxNednAUaXaJP/view" },
    { label: "Mappa Funebre",                  url: "https://www.google.com/maps/d/u/0/viewer?mid=1gxSBjjf9NSwnSZP6SIP4UVVA5cv1m2lY&ll=43.8157963799819%2C11.372541918299275&z=10" },
    { label: "Tango",                          url: "https://drive.google.com/drive/folders/1wT5EIO0WB1u5y_Mlb3jAACSW_7yZPZcN" },
    { label: "Mezzi 118",                      url: "http://192.168.2.123:8080/dump118/", intranet: true },
    { label: "Protocolli CO Firenze",          url: "https://drive.google.com/drive/u/0/folders/1A0L7jA6QkxEHzLL-hyQD50qI-2mwyIq0" },
    { label: "Regolamento Trasporti NRE",      url: "https://drive.google.com/drive/folders/1va72AvaAiL5XAIIMbeYGk5C1e2Su6hQw" },
  ],
  emergenza: [
    { label: "Homepage 118",                    url: "http://intranet.118.asf.locale/", intranet: true },
    { label: "Medical Note Explorer",           url: "https://app118-firenze.uslcentro.toscana.it" },
    { label: "LifeDesk",                        url: "https://checklist118.uslcentro.toscana.it/Consegne.aspx" },
    { label: "DUMP - Guasti",                   url: "http://172.19.19.239/118/guasti.php", intranet: true },
    { label: "Gestione Guasti",                 url: "http://intranet.118.asf.locale/index.php/acc-rapido/3-riga/gestione-guasti-e-richieste-di-assistenza-tecnica", intranet: true },
    { label: "S.A.R.A.",                        url: "https://sara.gruppo-informatico.com/Login.aspx" },
    { label: "Dati Post Chiusura Associazioni", url: "https://datipost118.uslcentro.toscana.it/wdodpc2/" },
    { label: "Codifica Regionale Targhe",       url: "https://docs.google.com/spreadsheets/d/1xYhNJWXpJO4gr1n8AutHg8GxYrp-lQhiw0b0Crm_xz4/edit" },
    { label: "Guida Inserimento Targhe",        url: "https://docs.google.com/presentation/d/1pWAmGdhAOI3tjbaHD-kUvryNpeF4iYnyekaWO2TkfkA/edit" },
    { label: "Tablet Rotti",                    url: "https://docs.google.com/spreadsheets/d/18GeLANtC43_U58puU05W99x3e3Rb6os3jeT6PrBjK7Q/edit" },
    { label: "TuConTi",                         url: "https://tuconti20.amm.telecomitalia.it/" },
    { label: "Cambio Password Dominio",         url: "https://cambiopassword118.uslcentro.toscana.it/" },
  ],
  archivio: [
    { label: "Rubrica Generale 118",         url: "https://docs.google.com/spreadsheets/d/1cDakO5InL3gx95SdUShPwQzJb4EJ5_yH/edit" },
    { label: "WebReparti",                   url: "https://trasportiurgenti.uslcentro.toscana.it/WebReparti/" },
    { label: "WebSer",                       url: "https://trasportiurgenti.uslcentro.toscana.it/WebSer/login.aspx" },
    { label: "Stradario Firenze",            url: "https://opendata.comune.fi.it/?q=metarepo/datasetinfo&id=11430710-56eb-4444-bd6f-c5433155afc5" },
    { label: "Calcolo Preventivo Trasporto", url: "https://docs.google.com/spreadsheets/d/1azZt3nlI9xe-CAygKVDIOY0RmcSSccRod72FGmw-e_Q/edit" },
    { label: "Calendario Notti",             url: "https://drive.google.com/drive/folders/1xp-ToYXze8TUoqQqogHv7v8WChZNQPmn" },
    { label: "Nottante",                     url: "https://webmail.aruba.it/" },
    { label: "Dispatcher Tablet Prova",      url: "https://demo.medicalnote.it" },
    { label: "Decodifica Codice Fiscale",    url: "https://sites.google.com/view/esculapio/link-rapidi/decodifica-codice-fiscale" },
    { label: "Progetto Tablet 118",          url: "https://drive.google.com/drive/folders/1AY0nKpE80wKFR9U8VHDagrNJxI5YsJwu" },
    { label: "Telefonia 118",                url: "https://docs.google.com/document/d/1i_X0fzFMihqFPBHOGHHBeECpWqSZ3_iYJSUjR43YUzw/edit" },
  ],
};
const SECTIONS = [
  ["comune",    "comune"],
  ["urgenti",   "trasporti urgenti"],
  ["emergenza", "emergenza sanitaria"],
  ["archivio",  "archivio"],
];

/* ---- render ---- */
const listing = document.getElementById("listing");
function render(){
  const frag = document.createDocumentFragment();
  for(const [key,label] of SECTIONS){
    const items = SITE_DATA[key]; if(!items?.length) continue;
    const sec = document.createElement("div"); sec.className="sec"; sec.dataset.sec=key;
    const h = document.createElement("div"); h.className="sec-h";
    h.innerHTML = `<span class="lbl">[ ${label} ]</span><span class="lead"></span><span class="n">${items.length}</span>`;
    sec.appendChild(h);
    for(const it of items){
      const a = document.createElement("a");
      a.className="row"; a.href=it.url; a.target="_blank"; a.rel="noopener noreferrer";
      a.dataset.search = it.label.toLowerCase();
      a.innerHTML =
        `<span class="mk">▸</span>`+
        `<span class="nm">${it.label}</span>`+
        (it.intranet ? `<span class="fl">[lan]</span>` : ``)+
        `<span class="go">↵</span>`;
      sec.appendChild(a);
    }
    frag.appendChild(sec);
  }
  listing.appendChild(frag);
}
render();

/* ---- selection / keyboard nav ---- */
const cmd = document.getElementById("cmd");
const res = document.getElementById("res");
let sel = -1;
const rows = () => [...listing.querySelectorAll(".row")].filter(r => r.style.display !== "none");
function paint(){
  const vis = rows();
  listing.querySelectorAll(".row.sel").forEach(r => r.classList.remove("sel"));
  if(sel < 0 || sel >= vis.length){ sel = vis.length ? 0 : -1; }
  if(sel >= 0){ vis[sel].classList.add("sel"); vis[sel].scrollIntoView({block:"nearest"}); }
}
function move(d){
  const n = rows().length; if(!n) return;
  sel = (sel + d + n) % n; paint();
}
function openSel(){
  const vis = rows();
  if(sel >= 0 && vis[sel]) window.open(vis[sel].href, "_blank", "noopener");
}
listing.addEventListener("mousemove", e => {
  const r = e.target.closest(".row"); if(!r) return;
  const vis = rows(); const i = vis.indexOf(r);
  if(i > -1 && i !== sel){ sel = i; paint(); }
});

/* ---- command / filter ---- */
function showRes(msg, err){ res.textContent=""; res.className="res"+(err?" err":""); res.innerHTML=msg; res.classList.remove("hidden"); }
function hideRes(){ res.classList.add("hidden"); }

function eta(anno){
  const oggi = new Date().getFullYear();
  if(isNaN(anno)) return ["input non valido", true];
  if(/^\d{1,2}$/.test(String(anno))){
    const y1=1900+ +anno, y2=2000+ +anno;
    if(y2<=oggi) return [`<span class="p">→</span> ${oggi-y1} anni (n. ${y1}) oppure ${oggi-y2} anni (n. ${y2})`, false];
    anno=y1;
  }
  anno=+anno;
  if(anno>oggi) return ["non lo so Rick… (anno futuro)", true];
  if(anno<1900) return ["… è morto.", true];
  return [`<span class="p">→</span> paziente di <b>${oggi-anno}</b> anni (o li compie quest'anno)`, false];
}

function filter(q){
  let total=0;
  listing.querySelectorAll(".sec").forEach(sec => {
    let n=0;
    sec.querySelectorAll(".row").forEach(r => {
      const show = r.dataset.search.includes(q);
      r.style.display = show ? "" : "none";
      if(show) n++;
    });
    sec.style.display = n ? "" : "none";
    total += n;
  });
  return total;
}

cmd.addEventListener("input", () => {
  const raw = cmd.value.trim();
  const m = raw.match(/^(?::)?et[àa]\s+(.+)$/i);
  if(m){
    filter("␀");            // svuota la lista mentre si è in modalità comando
    const [msg,err] = eta(m[1].trim());
    showRes(msg, err);
    sel = -1;
    return;
  }
  const q = raw.toLowerCase();
  const total = filter(q);
  if(!q){ hideRes(); }
  else if(total===0){ showRes(`nessun link per "<b>${raw}</b>"`, true); }
  else hideRes();
  sel = q ? 0 : -1; paint();
});

document.addEventListener("keydown", e => {
  if(e.key === "\\" && document.activeElement !== cmd){ e.preventDefault(); cmd.focus(); return; }
  if(e.key === "ArrowDown"){ e.preventDefault(); move(1); }
  else if(e.key === "ArrowUp"){ e.preventDefault(); move(-1); }
  else if(e.key === "Enter"){ if(rows().length){ e.preventDefault(); openSel(); } }
  else if(e.key === "Escape"){ cmd.value=""; filter(""); hideRes(); sel=-1; paint(); cmd.blur(); }
});
cmd.focus();

/* ---- theme (chiave dedicata, default dark) ---- */
const root = document.documentElement;
try{ const s=localStorage.getItem("esc-term-theme"); if(s) root.dataset.theme=s; }catch(e){}
document.getElementById("theme").onclick = () => {
  root.dataset.theme = root.dataset.theme==="dark" ? "light" : "dark";
  try{ localStorage.setItem("esc-term-theme", root.dataset.theme); }catch(e){}
};

/* ---- clock + turni ---- */
function hms(s){const h=(s/3600|0),m=(s%3600/60|0),c=s%60;return `${(h+'').padStart(2,'0')}:${(m+'').padStart(2,'0')}:${(c+'').padStart(2,'0')}`;}
function remOrd(d){const t=d.getHours()*3600+d.getMinutes()*60+d.getSeconds();if(t<7*3600)return 7*3600-t;if(t<14*3600)return 14*3600-t;if(t<20*3600)return 20*3600-t;return (24+7)*3600-t;}
function remEme(d){const t=d.getHours()*3600+d.getMinutes()*60+d.getSeconds();if(t<7*3600)return 7*3600-t;if(t<13*3600)return 13*3600-t;if(t<20*3600)return 20*3600-t;return (24+7)*3600-t;}
const tEme=document.getElementById("t-eme"), kOrd=document.querySelector("#t-ord .k");
function tick(){
  const d=new Date();
  document.getElementById("clk").textContent=d.toLocaleTimeString("it-IT");
  const ro=remOrd(d), re=remEme(d), merged=ro===re;
  tEme.style.display = merged ? "none" : "";
  kOrd.textContent = merged ? "ord/eme" : "ord";
  document.getElementById("cd-ord").textContent=hms(ro);
  document.getElementById("cd-eme").textContent=hms(re);
}
tick(); setInterval(tick,1000);

/* ---- news ticker ---- */
async function loadNews(){
  const FEEDS=["https://www.lanazione.it/firenze/rss","https://www.lanazione.it/prato/rss"];
  const inner=document.getElementById("news-in"), wrap=document.getElementById("news");
  const tf=(u,ms)=>{const c=new AbortController();const id=setTimeout(()=>c.abort(),ms);return fetch(u,{signal:c.signal}).finally(()=>clearTimeout(id));};
  const parse=xml=>{const doc=new DOMParser().parseFromString(xml,"text/xml");if(doc.querySelector("parsererror"))throw 0;const ns=[...doc.querySelectorAll("item")].slice(0,8);if(!ns.length)throw 0;return ns.map(n=>({title:(n.querySelector("title")?.textContent||"").trim(),link:n.querySelector("link")?.nextSibling?.nodeValue?.trim()||n.querySelector("link")?.textContent?.trim()||n.querySelector("guid")?.textContent?.trim()||"#",d:new Date(n.querySelector("pubDate")?.textContent||0)})).filter(i=>i.title);};
  async function feed(u){const e=encodeURIComponent(u);
    try{const r=await tf(`https://api.rss2json.com/v1/api.json?rss_url=${e}&count=8`,7000);const j=await r.json();if(j.status==="ok"&&j.items?.length)return j.items.map(i=>({title:(i.title||"").trim(),link:i.link||i.guid||"#",d:new Date(i.pubDate||0)})).filter(i=>i.title);}catch(x){}
    try{const r=await tf(`https://api.allorigins.win/get?url=${e}`,7000);const j=await r.json();if(j?.contents){let x=j.contents;if(x.startsWith("data:")&&x.includes("base64,")){const b=x.split("base64,")[1];x=new TextDecoder("utf-8").decode(Uint8Array.from(atob(b),c=>c.charCodeAt(0)));}return parse(x);}}catch(x){}
    try{const r=await tf(`https://corsproxy.io/?${e}`,7000);return parse(await r.text());}catch(x){}
    return [];
  }
  const rs=await Promise.allSettled(FEEDS.map(feed));
  const items=rs.filter(r=>r.status==="fulfilled"&&r.value.length).flatMap(r=>r.value).sort((a,b)=>b.d-a.d).slice(0,16);
  if(!items.length){ inner.innerHTML=`<span style="color:var(--faint)">notizie non disponibili</span>`; return; }
  const frag=document.createDocumentFragment();
  for(let p=0;p<2;p++) for(const it of items){
    const a=document.createElement("a"); a.href=it.link; a.target="_blank"; a.rel="noopener noreferrer"; a.textContent=it.title;
    frag.appendChild(a);
    const s=document.createElement("span"); s.className="sep"; s.textContent="·"; frag.appendChild(s);
  }
  inner.textContent=""; inner.appendChild(frag);
  wrap.style.setProperty("--dur", Math.max(40, items.reduce((s,i)=>s+i.title.length,0)*0.19)+"s");
}
loadNews(); setInterval(loadNews, 15*60*1000);
</script>
